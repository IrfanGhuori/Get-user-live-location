<h1>Get User Live Location basic</h1>
<div id="location"></div>

<br><br>

<h1> From Example</h1>
    
<form id="locationForm">

    <div><input type="text" id="country" name="country" placeholder="Country"></div>

    <div><input type="text" id="state" name="state" placeholder="State"></div>

    <div><input type="text" id="city" name="city" placeholder="City"></div>

    <div><input type="text" id="area" name="area" placeholder="Area"></div>

    <div><input type="text" id="postcode" name="postcode" placeholder="Postcode"></div>

    <div><input type="text" id="address" name="address" placeholder="Full Address"></div>

    <div><input type="text" id="latitude" name="latitude" placeholder="Latitude"></div>

    <div><input type="text" id="longitude" name="longitude" placeholder="Longitude"></div>

    <button type="submit">Submit</button>

</form>

 <script src="src/map.js"></script>
